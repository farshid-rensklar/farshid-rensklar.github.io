<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F2A44">
<title>JustDry – Chauffør</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
/* Chaufførens telefon: store knapper, én kolonne, kun dagens egne stop */
:root{color-scheme:light dark;--bg:light-dark(#F3F1EC,#0B1F33);--ink:light-dark(#12243A,#EEF1F4);--soft:light-dark(#566574,#AFBCC9);--card:light-dark(#FFFFFF,#12304C);--line:light-dark(#E1DCD2,#21405F);--teal:#1F9E8F;--tealBtn:#137468;--tealInk:light-dark(#137468,#4CC3B4);--err:light-dark(#B3261E,#FF8A80);--navy:#0F2A44}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
h1,h2,p{margin:0}
button,input,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.bar b{font-size:19px;flex:1}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;min-height:40px;padding:0 12px}
main{max-width:640px;margin:0 auto;padding:14px 14px 60px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.tabs button[aria-pressed=true]{background:var(--tealBtn);color:#fff;border-color:var(--tealBtn)}
.day{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.day input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.route{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;margin-bottom:14px}
.zone{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:18px 2px 8px}
.stop{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.stop.done{opacity:.6}
.stop h2{font-size:19px}
.stop .t{color:var(--tealInk);font-weight:700}
.stop p{color:var(--soft);margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts a,.acts button{color:inherit;min-height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;border:1px solid var(--line);background:transparent;cursor:pointer}
.acts .go{grid-column:1/-1;background:var(--tealBtn);color:#fff;border:0;font-size:18px;min-height:58px}
.acts .go:disabled{opacity:.5}
.note{margin-top:8px;background:light-dark(#F6F3EC,#0E2740);border-radius:10px;padding:8px 10px;font-size:15px}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.box{max-width:420px;margin:50px auto;padding:0 16px;display:grid;gap:12px}
.box input{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;width:100%}
.box button{min-height:54px;border-radius:12px;border:0;background:var(--tealBtn);color:#fff;font-weight:700}
.msg{color:var(--err)}
table{width:100%;border-collapse:collapse}td{padding:10px 4px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:700}
.docs{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:light-dark(#F6F3EC,#0E2740)}
.docs h3{font-size:17px;margin:0 0 4px}.docs .hint{color:var(--soft);font-size:14px}
.docs ul{list-style:none;padding:0;margin:8px 0}.docs li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.docs label{display:grid;gap:4px;font-size:14px;color:var(--soft);margin-top:8px}
.docs input,.docs select,.docs textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:8px 10px;width:100%;color:var(--ink)}
.docs textarea{min-height:64px}
.docs .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.docs .prev{display:flex;gap:6px;overflow:auto;margin-top:8px}.docs .prev img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.docs .save{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--tealBtn);color:#fff;font-weight:700;margin-top:10px}
.docs .save:disabled{opacity:.5}
/* Stykker & pris (assets/js/items.js) */
.items-ed{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.items-ed h3{font-size:17px;margin:0 0 4px}.items-ed .hint{color:var(--soft);font-size:14px;margin:0}
.it-list{list-style:none;padding:0;margin:8px 0}
.it-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.it-list li.empty{color:var(--soft)}
.it-list small{color:var(--soft)}
.it-list .qty{display:flex;align-items:center;gap:10px;flex:none}
.it-list .qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.it-list .qty b{min-width:20px;text-align:center}
.it-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.it-add select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px;min-width:0}
.it-add button,.it-save{min-height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;padding:0 14px;cursor:pointer}
.it-sum{margin:10px 0 0;font-size:15px}.it-sum small{color:var(--soft)}
.it-save{width:100%;margin-top:10px;border:0;background:var(--tealBtn);color:#fff;min-height:50px}
.it-save:disabled{opacity:.45;cursor:default}

.jds{display:grid;gap:8px;margin-top:8px}.jds-l{display:grid;gap:4px;font-size:14px;color:var(--soft)}
.jds-in{min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--card);padding:0 12px;font:600 18px ui-monospace,Menlo,monospace;text-transform:uppercase;color:var(--ink)}
.jds-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.jds-row button,.jds-stop{min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--ink)}
.jds-ok{background:var(--tealBtn)!important;color:#fff!important;border:0!important}.jds-video video{width:100%;border-radius:10px;background:#000}
.dres{color:var(--err);font-weight:600;margin-top:6px}
.toast{position:fixed;left:14px;right:14px;bottom:14px;background:var(--navy);color:#fff;padding:14px;border-radius:12px;text-align:center}
.toast.err{background:#7A1F18}
</style>
</head>
<body>
<div class="box" id="noCfg" hidden><h1>Ikke forbundet</h1><p>Udfyld config.js med Supabase-oplysningerne.</p></div>
<form class="box" id="login" hidden>
  <h1 style="display:flex;align-items:center;gap:10px"><svg width="34" height="34" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="64" fill="#0C2A45"/><circle cx="64" cy="64" r="56" fill="none" stroke="#C9A45A" stroke-width="5"/><path d="M56 39a8 8 0 1 1 8 8v8" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><path d="M64 55 L34 78 h60 z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/></svg>JustDry Chauffør</h1>
  <input id="em" type="email" autocomplete="username" placeholder="E-mail" required aria-label="E-mail">
  <input id="pw" type="password" autocomplete="current-password" placeholder="Adgangskode" required aria-label="Adgangskode">
  <p class="msg" id="lmsg" role="alert"></p>
  <button type="submit">Log ind</button>
</form>
<div id="app" hidden>
  <div class="bar"><b id="who">JustDry</b><button type="button" id="reload">↻</button><button type="button" id="out">Log ud</button></div>
  <main>
    <div class="day"><input type="date" id="day" aria-label="Dag"></div>
    <div class="tabs" role="group"><button type="button" data-t="pickup" aria-pressed="true">Hent</button><button type="button" data-t="delivery" aria-pressed="false">Levér</button><button type="button" data-t="report" aria-pressed="false">Mine tal</button></div>
    <div id="list" aria-live="polite"></div>
  </main>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')/* reserve-CDN hvis jsDelivr er nede */</script>
<script src="assets/js/scanner.js"></script>
<script src="assets/js/items.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),cfg=window.JUSTDRY||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const SLOTS=['10.00–12.00','12.00–14.00','14.00–16.00','16.00–18.00'];
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){$('noCfg').hidden=false;return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
let me=null,orders=[],locs=[],tab='pickup';
$('day').value=iso(new Date());
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' err':'');t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('login').hidden=false;$('app').hidden=true;return}
  const {data:st}=await db.from('staff').select('user_id,name,role,active').eq('user_id',session.user.id);
  me=(st||[]).find(s=>s.active);
  if(!me){$('lmsg').textContent='Din bruger er ikke tilføjet som chauffør.';await db.auth.signOut();$('login').hidden=false;return}
  $('login').hidden=true;$('app').hidden=false;$('who').textContent=me.name;
  await load();
}
async function load(){
  // RLS: a driver only receives orders where driver_id = their own user id
  let q=db.from('orders').select('id,name,phone,address,postcode,pickup_date,pickup_slot,delivery_date,delivery_slot,status,note,expert,donate,want_bag,items,total,coupon_code,paid,payment_status,driver_id,picked_up_at,delivered_at,picked_up_by,delivered_by').neq('status','annulleret').limit(1000);
  if(me.role!=='driver')q=q.eq('driver_id',me.user_id);
  const [o,l,sv]=await Promise.all([q,db.from('locations').select('postcode,town,zone'),db.from('services').select('id,name,price,category,sort').eq('active',true).order('sort')]);
  services=sv.data||[];
  if(o.error){toast('Kunne ikke hente stop: '+o.error.message,true);return}
  orders=o.data||[];locs=l.data||[];
  const ids=orders.filter(x=>['ny','bekræftet','hentet','klar'].includes(x.status)).map(x=>x.id);
  garments=[];
  if(ids.length){const g=await db.from('garments').select('id,order_id,garment_code,category,color,intake_condition,status').in('order_id',ids);
    const gp=g.data&&g.data.length?await db.from('garment_photos').select('garment_id').in('garment_id',g.data.map(x=>x.id)):{data:[]};
    garments=(g.data||[]).map(x=>({...x,photos:(gp.data||[]).filter(p=>p.garment_id===x.id).length}))}
  draw();
}
let garments=[],services=[];
const CAT={coat:'Frakke',suit:'Jakkesæt / blazer',shirt:'Skjorte',trousers:'Bukser',dress:'Kjole',knitwear:'Strik / cashmere',bag:'Pose – vask & fold',home:'Dyne / boligtekstil',other:'Andet'};
const docsOf=id=>garments.filter(g=>g.order_id===id&&g.photos>0);
const allOf=id=>garments.filter(g=>g.order_id===id);
function deliverPanel(o){const all=allOf(o.id);if(!all.length)return '';const done=all.filter(g=>g.status==='delivered').length;
  return `<section class="docs" data-deliver="${Number(o.id)}"><h3>Scan tøjet ved døren (${done}/${all.length})</h3><p class="hint">Scan QR-mærket på hvert stykke, før du afleverer. Så ved vi, at kunden får det rigtige tøj.</p>
  <ul>${all.map(g=>`<li>${g.status==='delivered'?'✓':'○'} <b>${esc(g.garment_code)}</b> · ${esc(CAT[g.category]||g.category)}${g.color?' · '+esc(g.color):''}</li>`).join('')}</ul><div class="dscan"></div><p class="dres" role="alert"></p></section>`}
function docsPanel(o){const list=docsOf(o.id);
  return `<section class="docs" data-docs="${Number(o.id)}"><h3>Registrér tøjet (${list.length} stk.)</h3><p class="hint">Tag mindst ét foto af hvert stykke – eller af posen ved vask & fold. Det beskytter både kunden og jer ved klager.</p>
  ${list.length?`<ul>${list.map(g=>`<li><b>${esc(g.garment_code)}</b> · ${esc(CAT[g.category]||g.category)}${g.color?' · '+esc(g.color):''} · ${g.photos} foto${g.intake_condition?`<br><small>${esc(g.intake_condition)}</small>`:''}</li>`).join('')}</ul>`:''}
  <div class="r2"><label>Type<select class="g-cat">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select></label><label>Farve<input class="g-color" maxlength="60"></label></div>
  <label>Mærke (valgfri)<input class="g-brand" maxlength="80"></label>
  <label>Stand, pletter og skader<textarea class="g-cond" maxlength="1000" placeholder="Fx plet på venstre ærme, mangler knap"></textarea></label>
  <label>Foto (1–5)<input class="g-photos" type="file" accept="image/*" capture="environment" multiple></label><div class="prev"></div>
  <button class="save" type="button" data-savegarment="${Number(o.id)}">＋ Gem dette stykke</button></section>`}
/* Photos are shrunk on the phone before upload (max 1600 px, JPEG) – faster on mobile data */
function shrink(file){return new Promise(res=>{if(!/^image\/(jpeg|png|webp)$/.test(file.type)){res(file);return}
  const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<file.size?new File([b],'p.jpg',{type:'image/jpeg'}):file),'image/jpeg',.82)};img.onerror=()=>res(file);img.src=u})}
const pending=new Map(); // panel -> {uuid, uploaded:[paths]} so a retry never duplicates
async function saveGarment(orderId,btn){
  const panel=btn.closest('[data-docs]'),files=[...panel.querySelector('.g-photos').files].slice(0,5);
  if(!files.length){toast('Tag mindst ét foto.',true);return}
  if(files.some(f=>f.size>12*1024*1024)){toast('Et foto er over 12 MB.',true);return}
  let st=pending.get(panel);if(!st){st={uuid:crypto.randomUUID(),uploaded:[]};pending.set(panel,st)}
  btn.disabled=true;btn.textContent='Uploader …';
  try{
    for(let i=st.uploaded.length;i<files.length;i++){
      const f=await shrink(files[i]),ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':f.type==='image/heic'?'heic':'jpg';
      const path=`${orderId}/${st.uuid}/${crypto.randomUUID()}.${ext}`;
      const up=await db.storage.from('garment-intake').upload(path,f,{contentType:f.type||'image/jpeg',upsert:false});
      if(up.error)throw up.error;st.uploaded.push(path)}
    const {error}=await db.rpc('register_garment',{p_order_id:orderId,p_uuid:st.uuid,p_category:panel.querySelector('.g-cat').value,p_color:panel.querySelector('.g-color').value,p_brand:panel.querySelector('.g-brand').value,p_condition:panel.querySelector('.g-cond').value,p_photos:st.uploaded});
    if(error)throw error;
    pending.delete(panel);toast('Gemt ✓');await load();
  }catch(err){btn.disabled=false;btn.textContent='Prøv igen';toast('Kunne ikke gemme: '+(err.message||'fejl'),true)}
}
const loc=o=>locs.find(l=>l.postcode===o.postcode)||{zone:'Øvrige',town:''};
const addr=o=>`${o.address}, ${o.postcode||''} ${loc(o).town}`.trim();
function draw(){
  const d=$('day').value,L=$('list');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===tab)));
  if(tab==='report'){
    const m=d.slice(0,7),mine=f=>orders.filter(o=>o[f+'_by']===me.user_id&&(o[f+'_at']||'').slice(0,7)===m);
    const p=mine('picked_up'),v=mine('delivered'),today=orders.filter(o=>(o.delivered_at||'').slice(0,10)===d&&o.delivered_by===me.user_id).length+orders.filter(o=>(o.picked_up_at||'').slice(0,10)===d&&o.picked_up_by===me.user_id).length;
    L.innerHTML=`<div class="stop"><h2>Mine tal – ${esc(new Date(d+'T12:00').toLocaleDateString('da-DK',{month:'long',year:'numeric'}))}</h2><table><tr><td>Afhentet</td><td>${p.length}</td></tr><tr><td>Leveret</td><td>${v.length}</td></tr><tr><td>Stop den valgte dag</td><td>${today}</td></tr></table></div>`;return}
  const isP=tab==='pickup';
  const list=orders.filter(o=>isP?o.pickup_date===d&&['ny','bekræftet','hentet'].includes(o.status):o.delivery_date===d&&['klar','leveret'].includes(o.status))
    .sort((a,b)=>loc(a).zone.localeCompare(loc(b).zone)||SLOTS.indexOf(isP?a.pickup_slot:a.delivery_slot)-SLOTS.indexOf(isP?b.pickup_slot:b.delivery_slot)||String(a.postcode).localeCompare(String(b.postcode)));
  if(!list.length){L.innerHTML='<p class="empty">Ingen stop denne dag. 🎉</p>';return}
  const todo=list.filter(o=>isP?o.status!=='hentet':o.status!=='leveret');
  const route=todo.length?'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(addr(todo[todo.length-1]))+(todo.length>1?'&waypoints='+encodeURIComponent(todo.slice(0,-1).slice(0,9).map(addr).join('|')):''):'';
  let z='';
  L.innerHTML=(route?`<a class="route" href="${esc(route)}" target="_blank" rel="noopener">🧭 Åbn dagens rute (${todo.length} stop)</a>`:'')+list.map(o=>{
    const done=isP?o.status==='hentet':o.status==='leveret';
    const zh=loc(o).zone!==z?(z=loc(o).zone,`<p class="zone">${esc(z)}</p>`):'';
    const when=isP?o.pickup_slot:o.delivery_slot;
    const at=isP?o.picked_up_at:o.delivered_at;
    return zh+`<article class="stop ${done?'done':''}" data-id="${Number(o.id)}">
      <span class="t">${esc(when||'')}</span> · #${Number(o.id)}
      <h2>${esc(o.name)}</h2><p>${esc(addr(o))}</p>
      ${o.note?`<p class="note">${esc(o.note)}</p>`:''}${o.expert?'<p class="note">Ekspert-ordre</p>':''}${o.donate?'<p class="note">Har donationspose med</p>':''}${o.want_bag&&!o.picked_up_at?'<p class="note"><b>Medbring en JustDry-pose til kunden</b></p>':''}
      <div class="acts"><a href="tel:${esc(o.phone)}">📞 Ring</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr(o))}" target="_blank" rel="noopener">📍 Kort</a>
      ${done?`<p style="grid-column:1/-1;text-align:center;color:var(--soft)">✓ ${isP?'Hentet':'Leveret'} ${at?esc(new Date(at).toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})):''}${isP?' · '+docsOf(o.id).length+' stk. registreret':''}</p>`:`<button class="go" type="button" data-a="${isP?'picked_up':'delivered'}" ${isP&&!docsOf(o.id).length?'disabled title="Registrér tøjet først"':''}${!isP&&allOf(o.id).some(g=>g.status!=='delivered')?'disabled title="Scan alt tøjet først"':''}>${isP?'✓ Marker som hentet':'✓ Marker som leveret'}</button>`}</div>
      ${isP&&['ny','bekræftet','hentet'].includes(o.status)&&!o.paid?JDItems.html(o,services):''}
      ${isP&&!done?docsPanel(o):''}${!isP&&!done?deliverPanel(o):''}</article>`}).join('');
  JDItems.attach(L,db,async id=>{JDItems.reset(id);await load()},toast);
  if(!isP)document.querySelectorAll('[data-deliver]').forEach(sec=>{const id=+sec.dataset.deliver;
    JDScan.attach(sec.querySelector('.dscan'),async code=>{const r=sec.querySelector('.dres');
      const {data,error}=await db.rpc('scan_garment',{p_code:code,p_event:'delivered',p_order_id:id});
      if(error){r.textContent='Fejl: '+error.message;return}
      if(!data.ok){if(navigator.vibrate)navigator.vibrate([200,100,200]);r.textContent=data.reason==='wrong_order'?`✋ ${data.code} hører til en anden ordre (${data.tracking}). Aflever det IKKE her.`:data.reason==='not_packed'?`${data.code} er ikke pakket på renseriet endnu.`:data.reason==='unknown'?`Ukendt kode ${data.code}.`:'Ikke tilladt.';return}
      toast('✓ '+data.code+' ('+data.order_done+'/'+data.order_total+')');await load()},{label:'Scan eller skriv koden',autofocus:false})})
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;draw()}});
$('day').addEventListener('change',draw);
$('reload').addEventListener('click',load);
$('out').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});
$('login').addEventListener('submit',async e=>{e.preventDefault();$('lmsg').textContent='';const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error){$('lmsg').textContent='Forkert e-mail eller adgangskode.';return}start()});
$('list').addEventListener('change',e=>{const f=e.target.closest('.g-photos');if(!f)return;const p=f.closest('[data-docs]');pending.delete(p);
  p.querySelector('.prev').replaceChildren(...[...f.files].slice(0,5).map(x=>{const i=document.createElement('img');i.alt='Foto af tøj';i.src=URL.createObjectURL(x);return i}))});
$('list').addEventListener('click',async e=>{const sg=e.target.closest('button[data-savegarment]');if(sg){await saveGarment(+sg.dataset.savegarment,sg);return}
  const b=e.target.closest('button[data-a]');if(!b)return;const id=+b.closest('[data-id]').dataset.id;
  b.disabled=true;b.textContent='Gemmer …';
  const {error}=await db.rpc('driver_update',{p_id:id,p_action:b.dataset.a});
  if(error){b.disabled=false;b.textContent='Prøv igen';toast(/JD:notscanned/.test(error.message)?'Scan alle stykker ved døren først.':/JD:nodocs/.test(error.message)?'Registrér tøjet med foto, før du markerer som hentet.':/JD:state/.test(error.message)?'Ordren har ændret status – opdater listen.':/JD:forbidden/.test(error.message)?'Stoppet er ikke dit.':'Fejl: '+error.message,true);return}
  toast(b.dataset.a==='picked_up'?'Hentet ✓':'Leveret ✓');await load()});
start();
})();
</script>
</body>
</html>
