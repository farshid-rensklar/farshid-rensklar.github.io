<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>JustDry – Admin</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: rolig arbejdsskærm – hurtig at læse mellem to afhentninger
   IDEA: et renseris ordrebog, kassebog og køreseddel i ét
   LAYOUT: navy sidemenu (skuffe på mobil), søgefelt øverst, indhold i kort */
:root{color-scheme:light dark;--bg:light-dark(#F3F1EC,#0B1F33);--ink:light-dark(#12243A,#EEF1F4);--soft:light-dark(#566574,#AFBCC9);--card:light-dark(#FFFFFF,#12304C);--line:light-dark(#E1DCD2,#21405F);--tint:light-dark(#F6F3EC,#0E2740);--teal:#1F9E8F;--tealBtn:#137468;--tealInk:light-dark(#137468,#4CC3B4);--warn:light-dark(#B4541A,#F2A46B);--err:light-dark(#B3261E,#FF8A80);--navy:#0F2A44}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:-.01em}h2{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--tealInk)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:11px;border:0;background:var(--tealBtn);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:#0F5F55}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.del{background:transparent;color:var(--err);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:progress}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select,textarea{min-height:42px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;width:100%}
textarea{min-height:60px;resize:vertical}
label{display:grid;gap:4px;font-size:13px;color:var(--soft)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;min-height:42px}
.chk input{width:20px;height:20px;min-height:20px;accent-color:var(--tealBtn)}
.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:4px 8px 18px;letter-spacing:-.03em}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#C9D4DF;cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button[aria-current=page]{background:var(--tealBtn);color:#fff}
nav .badge{margin-left:auto;background:#fff;color:var(--navy);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
nav hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:10px 4px}
nav small{display:block;color:#7F93A8;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px 4px}
.top{display:flex;align-items:center;gap:10px;padding:10px max(3vw,14px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.top .search{flex:1;max-width:460px;position:relative}
.top .search input{padding-left:36px}
.top .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--soft)}
.top .sp{flex:1}
.who{font-weight:600;font-size:14px;text-align:right;line-height:1.2}.who small{display:block;color:var(--soft);font-weight:500}
#menuBtn{display:none}
main{padding:18px max(3vw,14px) 60px;max-width:1240px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head p{color:var(--soft);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:grid;gap:2px}
.stat span{font-size:13px;color:var(--soft)}
.stat b{font-size:clamp(20px,2.4vw,28px);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.stat small{font-size:12.5px;color:var(--soft)}
.stat.go{cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat.go:hover{border-color:var(--teal)}
.stack{display:grid;gap:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ord{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.ord h3{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:light-dark(#E8F5F3,#173E4E);color:var(--tealInk);white-space:nowrap}
.pill.new{background:light-dark(#FDEBDD,#4A2E1C);color:var(--warn)}
.pill.ok{background:light-dark(#E7F4E7,#1F3D2A);color:light-dark(#2E7D32,#7FD38A)}
.pill.off{background:light-dark(#EEE,#24384D);color:var(--soft)}
.meta{color:var(--soft);font-size:14px;margin-top:4px;display:grid;gap:2px}
.lines{margin-top:8px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:3px 0}
.lines div span:last-child,.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{font-weight:700}
.note{margin-top:8px;font-size:14px;background:var(--tint);border-radius:10px;padding:7px 10px}
.ctl{display:grid;gap:8px;align-content:start}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.saved{font-size:13px;color:var(--tealInk);min-height:18px}
.empty{text-align:center;color:var(--soft);padding:34px 10px;border:1px dashed var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--tint)}
.scroll{overflow-x:auto}
.bars{display:grid;gap:6px;margin-top:10px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 96px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:14px;border-radius:6px;background:var(--teal);min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:12px;color:var(--soft);text-align:center;padding:4px 0}
.cal button{min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;padding:6px;gap:3px;text-align:left}
.cal button.out{opacity:.4}.cal button.today{border-color:var(--teal);border-width:2px}
.cal button[aria-pressed=true]{background:light-dark(#E8F5F3,#173E4E)}
.cal b{font-size:13px}.cal small{font-size:11px;font-weight:600;color:#fff;background:var(--teal);border-radius:99px;padding:0 6px}
.cal small.d{background:var(--navy)}
.stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stop .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.stop .k.d{background:var(--navy)}
.stars{color:#E0A100;letter-spacing:1px;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.msg{font-size:14px;color:var(--err);min-height:1px}
.box{max-width:420px;margin:60px auto;display:grid;gap:12px}
.hint{font-size:13px;color:var(--soft);margin-top:8px}
.zone{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:16px 0 6px}
.toast{position:fixed;right:16px;bottom:16px;z-index:40;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:360px}
.toast.err{background:#7A1F18}
@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{position:fixed;inset:0 auto 0 0;width:264px;z-index:20;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}#menuBtn{display:inline-flex}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.ord,.grid2{grid-template-columns:1fr}.who small{display:none}}
@media(max-width:600px){.top{flex-wrap:wrap}.top .search{order:5;flex-basis:100%;max-width:none}.stackt thead{display:none}.stackt tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.stackt td{border:0;padding:2px 0;display:flow-root}.stackt td::before{content:attr(data-l);float:left;width:8.5em;color:var(--soft);font-size:13px}.stackt td.n{text-align:left}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}

/* Stykker & pris (assets/js/items.js) */
.items-ed{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px}
.items-ed h3{font-size:17px;margin:0 0 4px}.items-ed .hint{color:var(--soft);font-size:14px;margin:0}
.it-list{list-style:none;padding:0;margin:8px 0}
.it-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.it-list li.empty{color:var(--soft)}
.it-list small{color:var(--soft)}
.it-list .qty{display:flex;align-items:center;gap:10px;flex:none}
.it-list .qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.it-list .qty b{min-width:20px;text-align:center}
.it-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.it-add select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px;min-width:0}
.it-add button,.it-save{min-height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;padding:0 14px;cursor:pointer}
.it-sum{margin:10px 0 0;font-size:15px}.it-sum small{color:var(--soft)}
.it-save{width:100%;margin-top:10px;border:0;background:var(--tealBtn);color:#fff;min-height:50px}
.it-save:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="noCfg" class="box card" hidden>
  <h1>Databasen er ikke forbundet endnu</h1>
  <p>Indsæt Supabase-adressen og "anon public"-nøglen i filen <b>config.js</b>.</p>
</div>

<form id="login" class="box card" hidden>
  <h1>JustDry Admin</h1>
  <label for="em">E-mail<input id="em" type="email" autocomplete="username" required></label>
  <label for="pw">Adgangskode<input id="pw" type="password" autocomplete="current-password" required></label>
  <p class="msg" id="lmsg" role="alert"></p>
  <button class="btn" type="submit" id="lbtn">Log ind</button>
</form>

<div class="layout" id="app" hidden>
  <aside id="side">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="64" fill="#0C2A45"/><circle cx="64" cy="64" r="56" fill="none" stroke="#C9A45A" stroke-width="5"/><path d="M56 39a8 8 0 1 1 8 8v8" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><path d="M64 55 L34 78 h60 z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/></svg><span style="font:italic 700 24px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em">JustDry</span></div>
    <nav id="nav" aria-label="Admin-menu"></nav>
  </aside>
  <div>
    <div class="top">
      <button class="btn line sm" id="menuBtn" type="button" aria-label="Åbn menu">☰</button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><input type="search" id="gsearch" placeholder="Søg sporingsnr. (JD-…), ordre-nr., navn eller telefon" aria-label="Søg ordre"></div>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <button class="btn line sm" id="refresh" type="button">Opdater</button>
      <button class="btn line sm" id="logout" type="button">Log ud</button>
    </div>
    <main id="main"></main>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')/* reserve-CDN hvis jsDelivr er nede */</script>
<script src="assets/js/items.js"></script>
<script src="assets/js/dkdays.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cfg=window.JUSTDRY||{};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kr=v=>(Number(v)||0).toLocaleString('da-DK')+' kr.';
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const dk=d=>d?new Date(d+'T12:00:00').toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'short'}):'';
const dt=d=>d?new Date(d).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const F_NEW=o=>o.status!=='annulleret'&&(o.status==='ny'||(o.created_at&&Date.now()-new Date(o.created_at)<864e5));
const STATUS=['ny','bekræftet','hentet','i rens','klar','leveret','annulleret'];
const SLOTS=['10.00–12.00','12.00–14.00','14.00–16.00','16.00–18.00'];
const PAY=[['','– vælg –'],['mobilepay','MobilePay'],['kort','Kort'],['kontant','Kontant'],['faktura','Faktura']];
const PSTAT={unpaid:'ikke betalt',pending:'link sendt',paid:'betalt',refunded:'refunderet',partially_refunded:'delvist refunderet',failed:'fejlet'};
const ROLES={admin:'Admin',staff:'Kontor',driver:'Chauffør'};
const isOpen=o=>!['leveret','annulleret'].includes(o.status);
const amt=o=>o.final_amount??o.total??0;
const SECTIONS=[['~Overblik'],['dashboard','Dashboard'],['ordrer','Ordrer'],['kalender','Kalender'],['rute','Ruter & chauffører'],['betalinger','Betalinger'],['rapporter','Rapporter'],['kunder','Kunder'],['klager','Klager & feedback'],['marketing','Marketing',1],['~Indstillinger',1],['services','Priser & services',1],['kuponer','Rabatkoder'],['anmeldelser','Anmeldelser'],['lokationer','Postnumre & zoner',1],['medarbejdere','Medarbejdere',1],['log','Revisionslog',1]];

if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){$('noCfg').hidden=false;return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const D={custs:[],spend:[],closed:[],settings:[],orders:[],staff:[],services:[],coupons:[],reviews:[],locations:[],payments:[],complaints:[],audit:[],garments:[],gphotos:[]};
let me=null,sec=(location.hash||'#dashboard').slice(1);
const ui={mk:today().slice(0,7),view:'today',q:'',month:today().slice(0,7),day:today(),routeDay:today(),routeType:'pickup',zone:'',rep:today().slice(0,7),open:null};
if(!SECTIONS.some(s=>s[0]===sec))sec='dashboard';
const isAdmin=()=>me&&me.role==='admin';
const isOffice=()=>me&&['admin','staff'].includes(me.role);

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){$('login').hidden=false;$('app').hidden=true;return}
  const {data:st}=await db.from('staff').select('user_id,name,role,active,phone');
  D.staff=st||[];me=D.staff.find(s=>s.user_id===session.user.id&&s.active);
  if(!me){$('lmsg').textContent='Din bruger er ikke tilføjet som medarbejder.';await db.auth.signOut();$('login').hidden=false;$('app').hidden=true;return}
  if(me.role==='driver'){location.replace('driver.html');return}
  $('login').hidden=true;$('app').hidden=false;$('who').innerHTML=esc(me.name)+'<small>'+esc(ROLES[me.role])+'</small>';
  await loadAll();
}
async function loadAll(){
  const q=await Promise.all([
    db.from('orders').select('*').order('pickup_date',{ascending:true}).order('id').limit(5000),
    db.from('staff').select('user_id,name,role,active,phone'),
    db.from('services').select('*').order('sort'),
    db.from('coupons').select('*').order('code'),
    db.from('reviews').select('*').order('created_at',{ascending:false}),
    db.from('locations').select('*').order('postcode'),
    db.from('payments').select('*').order('id',{ascending:false}).limit(2000),
    db.from('complaints').select('*').order('id',{ascending:false}).limit(1000),
    isAdmin()?db.from('audit_log').select('*').order('id',{ascending:false}).limit(500):Promise.resolve({data:[]}),
    db.from('garments').select('*').order('id').limit(5000),
    db.from('garment_photos').select('id,garment_id,storage_path,photo_type').limit(20000),
    db.from('settings').select('key,value'),
    db.from('closed_days').select('*').order('day'),
    db.from('ad_spend').select('*'),
    db.from('customers').select('email,phone,name,offers_ok,offers_at')]);
  const err=q.find(r=>r.error);
  ['orders','staff','services','coupons','reviews','locations','payments','complaints','audit','garments','gphotos','settings','closed','spend','custs'].forEach((k,i)=>D[k]=q[i].data||[]);
  render(err?('Noget kunne ikke hentes: '+err.error.message):'');
}
const setting=(k,d)=>((D.settings.find(x=>x.key===k)||{}).value??d);
const zoneOf=o=>(D.locations.find(l=>l.postcode===o.postcode)||{}).zone||'Øvrige';
const townOf=o=>(D.locations.find(l=>l.postcode===o.postcode)||{}).town||'';
const staffName=id=>(D.staff.find(s=>s.user_id===id)||{}).name||'';
const drivers=()=>D.staff.filter(s=>s.active);
/* Samtykke til tilbud: det nyeste svar gælder – fra kontoen (Min konto) eller fra seneste bestilling */
const offersOk=c=>{const acc=D.custs.find(x=>(c.email&&x.email&&x.email.toLowerCase()===String(c.email).toLowerCase()));if(acc&&acc.offers_at&&acc.offers_at>(c.at||''))return !!acc.offers_ok;return !!c.ok};
const GIFT_TXT={da:['Hej {navn}! Tak fordi du bruger JustDry. Her er en personlig rabat på {rabat} til din næste bestilling: {link}','Kode: {kode} · gælder til {dato}. Vil du ikke have flere tilbud, så svar bare nej tak.','Din personlige rabat fra JustDry'],
 en:['Hi {navn}! Thank you for using JustDry. Here is a personal discount of {rabat} for your next order: {link}','Code: {kode} · valid until {dato}. If you do not want more offers, just reply no thanks.','Your personal discount from JustDry'],
 de:['Hallo {navn}! Danke, dass Sie JustDry nutzen. Hier ist ein persönlicher Rabatt von {rabat} für Ihre nächste Bestellung: {link}','Code: {kode} · gültig bis {dato}. Wenn Sie keine Angebote mehr möchten, antworten Sie einfach mit nein danke.','Ihr persönlicher Rabatt von JustDry'],
 sv:['Hej {navn}! Tack för att du använder JustDry. Här är en personlig rabatt på {rabat} till din nästa beställning: {link}','Kod: {kode} · gäller till {dato}. Vill du inte ha fler erbjudanden, svara bara nej tack.','Din personliga rabatt från JustDry']};
const ORDER_PATH={da:'bestil.html',en:'en/order.html',de:'de/bestellen.html',sv:'sv/bestall.html'};
function giftMsg(c,k){const L=GIFT_TXT[c.lang]||GIFT_TXT.da,p=ORDER_PATH[c.lang]||ORDER_PATH.da;

  const mins=+setting('slot_minutes',120),stopm=+setting('stop_minutes',8),dis=isAdmin()?'':'disabled';

  const t0=today(),hol=[];for(const y of [+t0.slice(0,4),+t0.slice(0,4)+1])for(const [d,n] of JDDays.holidays(y))if(d>=t0&&hol.length<14)hol.push([d,n]);

rapporter(){
  const [y,m]=ui.rep.split('-').map(Number),from=iso(new Date(y,m-1,1)),to=iso(new Date(y,m,0));

  const months=[];for(let i=11;i>=0;i--){const d=new Date(y,m-1-i,1),k=iso(d).slice(0,7);const l=D.orders.filter(o=>o.status!=='annulleret'&&(o.pickup_date||'').startsWith(k));months.push([k,sum(l),l.length])}

    <div class="card"><h2>Chauffører – ${esc(ui.rep)}</h2><table><thead><tr><th>Navn</th><th class="n">Afhentet</th><th class="n">Leveret</th></tr></thead><tbody>${Object.values(st).filter(s=>s.p||s.d||s.role==='driver').map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${s.p}</td><td class="n">${s.d}</td></tr>`).join('')||'<tr><td colspan="3">Ingen kørsler registreret.</td></tr>'}</tbody></table></div>
  </div>
  <div class="grid2" style="margin-top:12px">
    <div class="card scroll"><h2>Pr. dag</h2><table class="stackt"><thead><tr><th>Dag</th><th class="n">Ordrer</th><th class="n">Omsætning</th><th class="n">Betalt</th></tr></thead><tbody>${days.map(([k,n,v,p])=>`<tr><td data-l="Dag">${esc(dk(k))}</td><td data-l="Ordrer" class="n">${n}</td><td data-l="Omsætning" class="n">${kr(v)}</td><td data-l="Betalt" class="n">${kr(p)}</td></tr>`).join('')||'<tr><td colspan="4">Ingen ordrer i måneden.</td></tr>'}</tbody></table></div>

    const p={status:g('status').value,driver_id:g('driver_id').value||null,delivery_date:g('delivery_date').value||null,delivery_slot:g('delivery_slot').value||null,final_amount:fa===''?null:+fa,amount_confirmed:g('amount_confirmed').checked,paid:g('paid').checked,payment_method:g('payment_method').value||null,staff_note:g('staff_note').value.trim()||null};
    b.disabled=true;const r=await act(()=>db.from('orders').update(p).eq('id',id).select().single(),art.querySelector('.saved'));b.disabled=false;
    if(r&&r!==true){const i=D.orders.findIndex(o=>o.id===id);D.orders[i]=r;setTimeout(render,600)}}
  if(a==='payLink'){const id=+b.closest('[data-id]').dataset.id;b.disabled=true;try{const j=await fn('create-payment',{order_id:id});try{await navigator.clipboard.writeText(j.url)}catch(_){}toast('Betalingslink oprettet og kopieret – send det til kunden');prompt('Betalingslink:',j.url);await loadAll()}catch(err){toast('Kunne ikke lave link: '+err.message,true)}b.disabled=false}
  if(a==='refund'){const id=+b.closest('[data-id]').dataset.id;const v=prompt('Beløb der skal refunderes i kr. (tomt = hele beløbet):','');if(v===null)return;if(v!==''&&!(+v>0)){toast('Ugyldigt beløb',true);return}if(!confirm('Refundér '+(v?v+' kr.':'hele beløbet')+' for ordre #'+id+'?'))return;b.disabled=true;try{await fn('refund-payment',v===''?{order_id:id}:{order_id:id,amount_kr:+v});toast('Refusion sendt');await loadAll()}catch(err){toast('Refusion fejlede: '+err.message,true)}b.disabled=false}
  if(a==='showPhotos'){const art=b.closest('[data-id]'),id=+art.dataset.id,box=art.querySelector('.gimgs');b.disabled=true;
    const ps=D.gphotos.filter(p=>D.garments.some(g=>g.id===p.garment_id&&g.order_id===id));box.textContent='';
    for(const ph of ps){const {data,error}=await db.storage.from('garment-intake').createSignedUrl(ph.storage_path,600);
      if(error||!data){toast('Foto kunne ikke hentes: '+(error?error.message:''),true);continue}
      const a2=document.createElement('a');a2.href=data.signedUrl;a2.target='_blank';a2.rel='noopener';const im=document.createElement('img');im.src=data.signedUrl;im.alt='Tøjfoto';im.style.cssText='width:96px;height:96px;object-fit:cover;border-radius:8px';a2.append(im);box.append(a2)}
    b.disabled=false}
  if(a==='saveComplaint'){const c=b.closest('[data-cid]'),id=+c.dataset.cid,st=c.querySelector('[data-f=cstatus]').value,res=c.querySelector('[data-f=resolution]').value.trim()||null;
    const p={status:st,resolution:res,handled_by:me.user_id,resolved_at:st==='resolved'?new Date().toISOString():null};
    if(await act(()=>db.from('complaints').update(p).eq('id',id))){Object.assign(D.complaints.find(x=>x.id===id),p);toast('Gemt');render()}}
  if(a==='markPaid'){const tr=b.closest('tr'),id=+tr.dataset.id,pm=tr.querySelector('[data-f=pm]').value||null;if(await act(()=>db.from('orders').update({paid:true,payment_method:pm}).eq('id',id))){Object.assign(D.orders.find(o=>o.id===id),{paid:true,payment_status:'paid',payment_method:pm});render()}}
  if(a==='couponDel'){const code=b.closest('tr').dataset.code;if(!confirm('Slet koden '+code+'?'))return;if(await act(()=>db.from('coupons').delete().eq('code',code))){D.coupons=D.coupons.filter(c=>c.code!==code);render()}}
  if(a==='saveService'){const tr=b.closest('tr'),id=+tr.dataset.sid,g=f=>tr.querySelector(`[data-f="${f}"]`),s=D.services.find(x=>x.id===id);const names=Object.assign({},s.names||{});['en','de','sv'].forEach(l=>{const v=g(l).value.trim();if(v)names[l]=v;else delete names[l]});const p={name:g('name').value.trim(),names,price:Math.max(0,parseInt(g('price').value,10)||0),popular:g('popular').checked,active:g('active').checked};if(!p.name)return;if(await act(()=>db.from('services').update(p).eq('id',id),tr.querySelector('.saved')))Object.assign(s,p)}
  if(a==='revToggle'){const id=+b.closest('[data-rid]').dataset.rid,r=D.reviews.find(x=>x.id===id);if(await act(()=>db.from('reviews').update({visible:!r.visible}).eq('id',id))){r.visible=!r.visible;render()}}
  if(a==='revDel'){const id=+b.closest('[data-rid]').dataset.rid;if(!confirm('Slet anmeldelsen?'))return;if(await act(()=>db.from('reviews').delete().eq('id',id))){D.reviews=D.reviews.filter(x=>x.id!==id);render()}}
  if(a==='staffSave'){const tr=b.closest('tr'),uid=tr.dataset.uid;const role=tr.querySelector('[data-f=role]').value,active=tr.querySelector('[data-f=active]').checked;if(await act(()=>db.rpc('set_staff',{p_uid:uid,p_role:role,p_active:active}))){Object.assign(D.staff.find(s=>s.user_id===uid),{role,active});toast('Gemt');render()}}
  if(a==='staffDel'){const uid=b.closest('tr').dataset.uid;if(!confirm('Fjern '+staffName(uid)+' som medarbejder?'))return;if(await act(()=>db.rpc('remove_staff',{p_uid:uid}))){D.staff=D.staff.filter(s=>s.user_id!==uid);render()}}
});
main.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.form;submitting=k;const v=n=>(f.elements[n]?.value||'').trim(),btn=f.querySelector('button');
  if(!f.checkValidity()){f.reportValidity();return}
  btn.disabled=true;
  try{
  if(k==='gift'){const c=D.orders.filter(o=>String(o.phone||'').replace(/\s/g,'')===ui.gift).sort((x,y)=>(x.created_at||'')<(y.created_at||'')?1:-1)[0];if(!c)return;
    const kind=v('kind'),value=parseInt(v('value'),10);if(!(value>0)){toast('Skriv en værdi',true);return}if(kind==='percent'&&value>100){toast('Procent kan højst være 100',true);return}
    const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',rnd=crypto.getRandomValues(new Uint8Array(6)),code='JD-'+[...rnd].map(x=>A[x%A.length]).join('');
    const row={code,kind,value,max_uses:1,expires:v('expires')||null,for_phone:c.phone,for_email:c.email||null,for_name:c.name,note:'Personlig'};
    const r=await act(()=>db.from('coupons').insert(row).select().single());if(r){D.coupons.push(r);ui.giftDone={k:ui.gift,c:r};toast('Koden er lavet');render()}return}
  if(k==='coupon'){const row={code:v('code').toUpperCase().replace(/\s/g,''),kind:v('kind'),value:parseInt(v('value'),10),expires:v('expires')||null,max_uses:v('max_uses')?parseInt(v('max_uses'),10):null};if(row.kind==='percent'&&row.value>100){toast('Procent kan højst være 100',true);return}const r=await act(()=>db.from('coupons').insert(row).select().single());if(r){D.coupons.push(r);render()}}
  if(k==='service'){const cat=v('category'),mx=Math.max(0,...D.services.map(s=>s.sort||0)),names={};if(v('en'))names.en=v('en');if(v('de'))names.de=v('de');if(v('sv'))names.sv=v('sv');const r=await act(()=>db.from('services').insert({category:cat,name:v('name'),names,price:parseInt(v('price'),10)||0,sort:mx+10}).select().single());if(r){D.services.push(r);render()}}
  if(k==='review'){const r=await act(()=>db.from('reviews').insert({name:v('name'),town:v('town')||null,rating:+v('rating'),source:v('source'),text:v('text'),visible:false}).select().single());if(r){D.reviews.unshift(r);render()}}
  if(k==='spend'){const mo=ui.mk+'-01',rows=[];for(const el of f.querySelectorAll('input[name^=sp_]')){if(el.value!=='')rows.push({month:mo,source:el.name.slice(3),amount:Math.max(0,parseInt(el.value,10)||0)})}
    const ns=f.elements.new_src.value,na=f.elements.new_amt.value;if(ns&&na!=='')rows.push({month:mo,source:ns,amount:Math.max(0,parseInt(na,10)||0)});
    if(!rows.length){toast('Skriv et beløb',true);return}
    const r=await act(()=>db.from('ad_spend').upsert(rows).select());if(r){rows.forEach(x=>{D.spend=D.spend.filter(s=>!(s.month.slice(0,7)===ui.mk&&s.source===x.source)).concat([x])});toast('Annoncekroner gemt');render()}return}
  if(k==='closed'){const day=v('day'),note=v('note');if(!/^\d{4}-\d{2}-\d{2}$/.test(day)){toast('Vælg en dato',true);return}
    const r=await act(()=>db.from('closed_days').upsert([{day,note:note||null}]).select());if(r){D.closed=D.closed.filter(c=>c.day!==day).concat(r).sort((x,y)=>x.day<y.day?-1:1);toast('Dagen er lukket');render()}return}
  if(k==='capacity'){const n=parseInt(v('cap'),10),m=parseInt(v('mins'),10),st=parseInt(v('stopm'),10);if(!(n>=1&&n<=50)||!(m>=30&&m<=240)||!(st>=1&&st<=60)){toast('Tjek tallene: loft 1–50, minutter 30–240, stop 1–60',true);return}
    const rows=[{key:'slot_capacity',value:String(n)},{key:'slot_minutes',value:String(m)},{key:'stop_minutes',value:String(st)}];
    if(await act(()=>db.from('settings').upsert(rows))){rows.forEach(r=>{const x=D.settings.find(s=>s.key===r.key);if(x)x.value=r.value;else D.settings.push({...r})});toast('Kapacitet gemt');render()}return}
  if(k==='location'){if(!/^\d{4}$/.test(v('postcode'))){toast('Postnummeret skal være 4 cifre',true);return}const r=await act(()=>db.from('locations').insert({postcode:v('postcode'),town:v('town'),zone:v('zone')}).select().single());if(r){D.locations.push(r);D.locations.sort((a,b)=>a.postcode.localeCompare(b.postcode));render()}}
  if(k==='staff'){const r=await act(()=>db.rpc('add_staff',{p_email:v('email'),p_name:v('name'),p_role:v('role')}));if(r&&r!=='ok')toast(r,true);else if(r)await loadAll()}
  }finally{btn.disabled=false}
});
start();
})();
</script>
