<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rens med afhentning</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; color:#1a1a1a; }
  header { background:#0f3d3e; color:white; padding:60px 20px; text-align:center; }
  h1 { margin:0 0 10px; font-size:32px; }
  .knap { display:inline-block; margin-top:20px; background:#f2b134; color:#1a1a1a;
          padding:14px 28px; border-radius:30px; text-decoration:none; font-weight:bold; }
  section { padding:40px 20px; max-width:700px; margin:auto; }
  footer { text-align:center; padding:20px; color:#777; font-size:14px; }
</style>
</head>
<body>
  <header>
    <h1>Rens uden besvær</h1>
    <p>Vi henter dit tøj, renser det og bringer det tilbage.</p>
    <a class="knap" href="#kontakt">Bestil afhentning</a>
  </header>
  <section>
    <h2>Sådan virker det</h2>
    <p>1. Du bestiller afhentning.<br>2. Vi henter dit tøj.<br>3. Du får det rent hjem igen.</p>
  </section>
  <section id="kontakt">
    <h2>Kontakt</h2>
    <p>Vi dækker hele Nordsjælland.</p>
  </section>
  <footer>© 2026</footer>
</body>
</html>
